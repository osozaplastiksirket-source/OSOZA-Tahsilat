
name: OSOZA APK Olustur

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: OSOZA APK Derle
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK hazirla
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager bulunamadi."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: OSOZA Android projesini olustur
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/osoza/tahsilat

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'OSOZA'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.osoza.tahsilat'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.osoza.tahsilat'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="OSOZA Tahsilat"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/osoza/tahsilat/MainActivity.java <<'EOF'
          package com.osoza.tahsilat;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.JavascriptInterface;
          import android.content.ContentValues;
          import android.provider.MediaStore;
          import android.os.Environment;
          import android.util.Base64;

          public class MainActivity extends Activity {

              private WebView web;

              public class Bridge {

                  @JavascriptInterface
                  public String loadRecords() {
                      return getPreferences(0)
                          .getString("records", "[]");
                  }

                  @JavascriptInterface
                  public void saveRecords(String data) {
                      getPreferences(0).edit()
                          .putString("records", data)
                          .apply();
                  }

                  @JavascriptInterface
                  public void saveJpeg(String name, String data) {
                      try {
                          String raw = data;

                          if (raw.contains(",")) {
                              raw = raw.substring(raw.indexOf(",") + 1);
                          }

                          byte[] bytes = Base64.decode(
                              raw,
                              Base64.DEFAULT
                          );

                          ContentValues values = new ContentValues();

                          values.put(
                              MediaStore.Images.Media.DISPLAY_NAME,
                              name.endsWith(".jpg")
                                  ? name
                                  : name + ".jpg"
                          );

                          values.put(
                              MediaStore.Images.Media.MIME_TYPE,
                              "image/jpeg"
                          );

                          values.put(
                              MediaStore.Images.Media.RELATIVE_PATH,
                              Environment.DIRECTORY_PICTURES + "/OSOZA"
                          );

                          android.net.Uri uri =
                              getContentResolver().insert(
                                  MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                  values
                              );

                          if (uri != null) {
                              try (
                                  java.io.OutputStream out =
                                      getContentResolver()
                                          .openOutputStream(uri)
                              ) {
                                  out.write(bytes);
                              }
                          }

                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }
              }

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  web = new WebView(this);
                  setContentView(web);

                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.getSettings().setAllowFileAccess(true);

                  web.addJavascriptInterface(
                      new Bridge(),
                      "Android"
                  );

                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());

                  web.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          elif [ -f "app/src/main/assets/index.html" ]; then
            echo "HTML dosyasi bulundu."
          else
            echo "HATA: index.html bulunamadi."
            echo "GitHub ana dizinine index.html yukleyin."
            exit 1
          fi

          echo "Android projesi hazir."

      - name: APK olustur
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: APK indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: OSOZA-Tahsilat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
